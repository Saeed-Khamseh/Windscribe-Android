name: Collect scanner build diagnostics

on:
  push:
    paths:
      - '.github/workflows/scanner-build-diagnostics.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed debug APK workflow run
        default: '39065280268'
        required: true

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/feat/network-scanner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve existing compiler diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id || '39065280268' }}
        run: |
          gh run view "$SOURCE_RUN" --log-failed > /tmp/scanner-failed-run.log
          python3 - <<'PYTHON'
          import os
          lines = open('/tmp/scanner-failed-run.log').readlines()
          selected = set()
          for index, line in enumerate(lines):
              if 'e: file:' in line or 'error:' in line or ' FAILED' in line or 'What went wrong' in line or 'Caused by:' in line:
                  selected.update(range(max(0, index - 1), min(len(lines), index + 6)))
          selected.update(range(max(0, len(lines) - 20), len(lines)))
          with open('/tmp/scanner-build-diagnostics.txt', 'w') as report:
              report.write('Source workflow run: ' + os.environ['SOURCE_RUN'] + '\n')
              report.writelines(lines[index] for index in sorted(selected))
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          REPORT_REF="refs/notes/network-scanner-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git notes --ref="$REPORT_REF" add -F /tmp/scanner-build-diagnostics.txt "$GITHUB_SHA"
          git push origin "$REPORT_REF"
