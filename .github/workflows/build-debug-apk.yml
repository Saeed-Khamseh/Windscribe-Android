name: Build Android debug APK

on:
  push:
    paths:
      - '.github/workflows/build-debug-apk.yml'
      - 'base/**'
      - 'mobile/**'
      - 'common/**'
      - 'openvpn/**'
      - 'wgtunnel/**'
      - 'strongswan/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
  pull_request:
    paths:
      - '.github/workflows/build-debug-apk.yml'
      - 'base/**'
      - 'mobile/**'
      - 'common/**'
      - '*.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swig ninja-build cmake
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test network scanner
        run: |
          set -o pipefail
          bash ./gradlew :base:testFdroidDebugUnitTest --tests 'com.windscribe.vpn.scanner.*' -PabiFilter=arm64-v8a --stacktrace --no-daemon --console=plain 2>&1 | tee scanner-tests.log
      - name: Test scanner Compose screens
        run: |
          set -o pipefail
          bash ./gradlew :mobile:testFdroidDebugUnitTest --tests 'com.windscribe.mobile.ui.scanner.*' -PabiFilter=arm64-v8a --stacktrace --no-daemon --console=plain 2>&1 | tee scanner-ui-tests.log
      - name: Upload scanner test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-scanner-tests
          path: |
            base/build/reports/tests/testFdroidDebugUnitTest/
            mobile/build/reports/tests/testFdroidDebugUnitTest/
          if-no-files-found: warn
      - name: Build F-Droid debug APK (ARM64)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :mobile:assembleFdroidDebug -PabiFilter=arm64-v8a --stacktrace --no-daemon --console=plain 2>&1 | tee scanner-build.log
      - name: Summarize scanner validation
        if: always()
        run: |
          python3 - <<'PYTHON'
          import glob, os, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('*/build/test-results/testFdroidDebugUnitTest/TEST-com.windscribe.*scanner.*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Scanner tests\n' + str(totals) + '\n')
              for path in ['scanner-tests.log', 'scanner-ui-tests.log', 'scanner-build.log']:
                  if os.path.exists(path):
                      lines = open(path).readlines()
                      important = [line for line in lines if line.startswith('e: ') or 'error:' in line or ' FAILED' in line or 'What went wrong' in line]
                      summary.write('\n### ' + path + '\n```text\n' + ''.join(important[-60:] + lines[-100:]) + '\n```\n')
          PYTHON
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windscribe-fdroid-debug-apk
          path: mobile/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
