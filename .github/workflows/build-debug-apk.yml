name: Build Android debug APK

on:
  push:
    paths:
      - '.github/workflows/build-debug-apk.yml'
      - 'base/**'
      - 'mobile/**'
      - 'common/**'
      - 'openvpn/**'
      - 'wgtunnel/**'
      - 'strongswan/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
  pull_request:
    paths:
      - '.github/workflows/build-debug-apk.yml'
      - 'base/**'
      - 'mobile/**'
      - 'common/**'
      - '*.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swig ninja-build cmake
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test network scanner
        run: |
          bash ./gradlew :base:testFdroidDebugUnitTest --tests 'com.windscribe.vpn.scanner.*' -PabiFilter=arm64-v8a --stacktrace --no-daemon
      - name: Upload scanner test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-scanner-tests
          path: base/build/reports/tests/testFdroidDebugUnitTest/
          if-no-files-found: warn
      - name: Build F-Droid debug APK (ARM64)
        run: |
          chmod +x ./gradlew
          ./gradlew :mobile:assembleFdroidDebug -PabiFilter=arm64-v8a --stacktrace --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windscribe-fdroid-debug-apk
          path: mobile/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
