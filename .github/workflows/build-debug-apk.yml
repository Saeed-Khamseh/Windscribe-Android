name: Build Android debug APK

on:
  push:
    paths:
      - '.github/workflows/build-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swig ninja-build cmake
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build F-Droid debug APK (ARM64)
        run: |
          chmod +x ./gradlew
          ./gradlew :mobile:assembleFdroidDebug -PabiFilter=arm64-v8a --stacktrace --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windscribe-fdroid-debug-apk
          path: mobile/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
